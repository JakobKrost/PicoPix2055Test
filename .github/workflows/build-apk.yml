name: PicoPix APK bauen

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Projekt herunterladen
        uses: actions/checkout@v4

      - name: Java 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle 8.9 einrichten
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Android SDK 35 installieren
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Debug-APK kompilieren
        run: gradle --no-daemon :app:assembleDebug

      - name: APK-Datei anzeigen
        run: |
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: APK-Signatur prüfen
        run: |
          "${ANDROID_HOME}/build-tools/35.0.0/apksigner" verify \
            --verbose \
            --print-certs \
            app/build/outputs/apk/debug/app-debug.apk

      - name: APK-Paketinformationen prüfen
        run: |
          "${ANDROID_HOME}/build-tools/35.0.0/aapt" dump badging \
            app/build/outputs/apk/debug/app-debug.apk

      - name: APK als Download bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: PicoPix2055-Test-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
